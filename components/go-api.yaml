# Recipe do componente Greengrass v2 para a API Go.
#
# Empacotamento esperado do artefato (go-api.zip), gerado pela action a
# partir de components/go-api com os binários já compilados (cross-compile
# para amd64/x86_64):
#   go-api.zip
#   ├── go-api        (linux/amd64)
#   └── go-api.exe    (windows/amd64)
#
# O nome da pasta descompactada ({artifacts:decompressedPath}/go-api)
# corresponde ao nome do zip sem a extensão. Substitua <BUCKET_NAME> pelo
# bucket S3 usado no deploy.
#
# Os dispositivos não precisam de Go instalado: o binário chega pronto e é
# executado direto do diretório de artefatos. No Linux, a permissão de
# execução é concedida via Permission.Execute, pois o unzip do Greengrass
# não preserva o bit de execução.
---
RecipeFormatVersion: "2020-01-25"
ComponentName: go-api
ComponentVersion: "1.0.0"
ComponentDescription: API simples em Go para o AWS IoT Greengrass v2
ComponentPublisher: Me
ComponentConfiguration:
  DefaultConfiguration:
    Port: "3001"
Manifests:
  - Name: Linux
    Platform:
      os: linux
    Lifecycle:
      Setenv:
        PORT: "{configuration:/Port}"
      # Processo de longa duração: o Greengrass mantém o componente RUNNING
      # enquanto este processo estiver vivo e o reinicia conforme a política
      # de deployment se ele encerrar.
      Run:
        Script: |-
          "{artifacts:decompressedPath}/go-api/go-api"
    Artifacts:
      - URI: s3://<BUCKET_NAME>/go-api/1.0.0/go-api.zip
        Unarchive: ZIP
        Permission:
          Read: OWNER
          Execute: OWNER
  - Name: Windows
    Platform:
      os: windows
    Lifecycle:
      Setenv:
        PORT: "{configuration:/Port}"
      Run:
        Script: '"{artifacts:decompressedPath}\go-api\go-api.exe"'
    Artifacts:
      - URI: s3://<BUCKET_NAME>/go-api/1.0.0/go-api.zip
        Unarchive: ZIP
